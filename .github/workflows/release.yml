name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - name: Package every app + the full-suite bundle
        shell: bash
        run: bash scripts/package.sh all
      - uses: actions/upload-artifact@v4
        with: { name: ${{ matrix.name }}, path: dist/*, if-no-files-found: error }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create / update the GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ZengSuite ${TAG#v}" --notes "Free, open-source office suite for macOS, Windows and Linux. Not notarized yet: on macOS right-click the app and choose Open the first time; on Windows choose More info > Run anyway."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
