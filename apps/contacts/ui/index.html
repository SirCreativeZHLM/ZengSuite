<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>People</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/kit/zeng.css"><link rel="stylesheet" href="app.css">
<script src="/kit/icons.js"></script><script src="/kit/vendor/fflate.js"></script><script src="/kit/zeng.js"></script>
<script src="lib/vcard.js"></script><script src="lib/csv.js"></script><script src="lib/model.js"></script></head>
<body>
<div class="zk-app" id="app">
  <div class="zk-toolbar zk-titlebar" id="toolbar">
    <button class="zk-btn icon" id="b-side" title="Show or Hide Groups" aria-label="Show or Hide Groups"></button>
    <div class="zk-title" id="title">People</div>
    <div class="zk-spacer"></div>
    <div class="search" id="searchbox"><span class="si"></span><input class="zk-input selectable" id="q" type="search" placeholder="Search" aria-label="Search contacts" autocomplete="off" spellcheck="false"><button class="clear" id="qclear" aria-label="Clear search" hidden></button></div>
    <button class="zk-btn icon" id="b-new" title="New Contact (⌘N)" aria-label="New Contact"></button>
    <button class="zk-btn" id="b-edit" title="Edit Contact (⌘E)">Edit</button>
  </div>
  <div class="zk-fill zk-row" id="main">
    <aside class="zk-sidebar" id="side" aria-label="Groups"></aside>
    <section class="listcol" id="listcol" aria-label="Contacts">
      <div class="list-head" id="listhead"></div>
      <div class="list-wrap">
        <div class="list-scroll" id="list" tabindex="0" role="listbox" aria-multiselectable="true"></div>
        <div class="sticky-h" id="sticky" hidden></div>
        <div class="index" id="index" aria-hidden="true"></div>
      </div>
    </section>
    <div class="zk-resizer" id="resizer" role="separator" aria-orientation="vertical"></div>
    <section class="cardcol" id="card" aria-label="Contact card"></section>
  </div>
  <div class="zk-statusbar" id="status"></div>
</div>
<div id="drop" class="dropveil zk-hidden">Drop vCard, CSV or backup files to import</div>
<div id="print-root" aria-hidden="true"></div>
<script src="app.js"></script><script src="card.js"></script><script src="dialogs.js"></script><script src="print.js"></script><script src="boot.js"></script></body></html>
