<!doctype html><meta charset=utf-8><link rel=stylesheet href=/kit/zeng.css><link rel=stylesheet href=render.css>
<script src=/kit/icons.js></script><script src=/kit/zeng.js></script><script src=shapes.js></script><script src=themes.js></script><script src=model.js></script><script src=chart.js></script><script src=render.js></script>
<body style="overflow:auto;height:auto;background:#888"><div id=out style="display:flex;flex-wrap:wrap;gap:10px;padding:10px"></div>
<script>
const out=document.getElementById('out');
function show(deck,slide,i,sc){const w=document.createElement('div');w.style.cssText=`width:${deck.size.w*sc}px;height:${deck.size.h*sc}px;position:relative`;const ks=K.renderSlide(deck,slide,{index:i,edit:false});ks.style.transform=`scale(${sc})`;w.append(ks);out.append(w);K.fit(ks);}
if(location.hash=='#themes'){
 for(const t of K.themes){const d=K.newDeck(t.id);d.opts.showNumbers=true;
  const s1=K.newSlide(d,'title');s1.objs[0].paras=K.paras('Quarterly Review');s1.objs[1].paras=K.paras('Product & Design — 2026');
  const s2=K.newSlide(d,'titleContent');s2.objs[0].paras=K.paras('What shipped');s2.objs[1].paras=K.paras('First point\nSecond point is longer and wraps around the line\nThird');
  s2.objs.push(K.newObj('shape',{shape:'star5',x:700,y:300,w:120,h:120}));
  const s3=K.newSlide(d,'section');s3.objs[0].paras=K.paras('Part Two');
  const s4=K.newSlide(d,'bigFact');s4.objs[0].paras=K.paras('87%');s4.objs[1].paras=K.paras('of users love it');
  [s1,s2,s3,s4].forEach((s,i)=>show(d,s,i,.3));}
}
if(location.hash=='#shapes'){
 const d=K.newDeck('clean');const s={id:'x',layout:'blank',objs:[]};let i=0;
 for(const sh of K.shapeList){const c=i%10,r=Math.floor(i/10);const o=K.newObj('shape',{shape:sh.id,x:20+c*92,y:10+r*92,w:80,h:80,line:{c:'fg',w:1.5}});if(sh.open)o.fill=null;s.objs.push(o);i++;}
 d.size={w:960,h:960};show(d,s,0,1);
}
if(location.hash=='#charts'){const d=K.newDeck('clean');const s={id:'x',layout:'blank',objs:[]};['column','bar','line','area','pie','donut','scatter'].forEach((k,i)=>{s.objs.push(K.newObj('chart',{kind:k,x:10+(i%3)*315,y:10+Math.floor(i/3)*210,w:300,h:200,opt:{legend:true,grid:true,labels:i%2==0,title:k}}))});show(d,s,0,1)}
</script>
