<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".55" stop-color="#ff453a"/><stop offset="1" stop-color="#c8182a"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a0a12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#gl)"/>
  <!-- a day as stacked blocks of time: three busy blocks, one protected-green gap, a "now" playhead -->
  <g filter="url(#sh)">
    <rect x="236" y="270" width="330" height="104" rx="52" fill="#fff"/>
    <rect x="236" y="420" width="190" height="104" rx="52" fill="#fff" fill-opacity=".92"/>
    <rect x="470" y="420" width="318" height="104" rx="52" fill="#fff" fill-opacity=".92"/>
    <rect x="236" y="570" width="260" height="104" rx="52" fill="#30d158"/>
    <rect x="540" y="570" width="248" height="104" rx="52" fill="#fff" fill-opacity=".92"/>
    <rect x="236" y="720" width="410" height="104" rx="52" fill="#fff" fill-opacity=".8"/>
  </g>
  <rect x="650" y="196" width="22" height="660" rx="11" fill="#2a0b10" fill-opacity=".82"/>
  <circle cx="661" cy="196" r="36" fill="#2a0b10" fill-opacity=".88"/>
  <circle cx="661" cy="196" r="14" fill="#ff7a59"/>
</svg>
