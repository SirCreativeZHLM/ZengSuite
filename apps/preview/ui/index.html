<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Look</title>

<link rel="stylesheet" href="/kit/zeng.css"><link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css"><link rel="stylesheet" href="app.css">
<script src="/kit/icons.js"></script><script src="/kit/zeng.js"></script></head>
<body>
<div class="zk-app" id="app">

<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
<script src="js/core.js"></script>
<script src="js/ann.js"></script>
<script src="js/pdfview.js"></script>
<script src="js/pdfsave.js"></script>
<script src="js/pdftools.js"></script>
