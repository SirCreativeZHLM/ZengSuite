[package]
name = "zeng-shell"
description = "Native window + webview host shared by every ZengSuite app (no Electron)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
include_dir = { workspace = true }
rfd = "0.17"
base64 = "0.22"
open = "5"
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
